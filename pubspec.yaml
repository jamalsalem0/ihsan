name: ihsan
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Your App Dependencies
  adhan: ^2.0.0+1
  animated_notch_bottom_bar: ^1.0.3
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^19.5.0
  flutter_riverpod: ^2.5.1
  flutter_svg: ^2.2.1
  geolocator: ^14.0.2
  go_router: ^16.2.4
  google_fonts: ^6.3.2
  http: ^1.5.0
  intl: ^0.20.2
  just_audio: ^0.10.5
  lottie: ^3.3.2
  page_flip: ^0.2.5+1
  riverpod_annotation: ^2.3.5
  shared_preferences: ^2.5.3
  simple_animations: ^5.2.0
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Development & Code Generation
  build_runner: ^2.4.9
  flutter_lints: ^5.0.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/data/
    - assets/images/
    - assets/icon/
    - assets/sounds/

# This is the correct placement for the launcher icons configuration
flutter_launcher_icons:
  android: true
  ios: true # You can set this to false if you only target Android
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#09142c"
  adaptive_icon_foreground: "assets/icon/icon.png"